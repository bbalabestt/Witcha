<!-- @dsCard height=300 -->
<div class="wm-cover">
  <style>
    .wm-cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--surface-page); }
    .wm-cover svg { position: absolute; left: 0; top: 0; width: 960px; height: 300px; }
    .wm-cover .blue { fill: var(--brand-witcha-blue); }
    .wm-cover .deep { fill: var(--brand-deep-blue); }
    .wm-cover .aqua { fill: var(--brand-aqua-light); }
    .wm-cover .ivory { fill: var(--brand-ivory); }
    .wm-cover .gold { fill: none; stroke: var(--brand-gold); stroke-width: 1.5px; }
    .wm-cover .text { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }
    .wm-cover .name { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 100px; line-height: 0.95; letter-spacing: 0.02em; color: var(--text-primary); }
    .wm-cover .tag { margin: 16px 0 0; font-family: var(--font-serif); font-style: italic; font-size: 14px; color: var(--text-primary); }
  </style>
  <!--
    blocks: brand-witcha-blue slab 440 x 300 (bleeds top, right, bottom); brand-deep-blue arch 120 wide; brand-aqua-light arch 96 wide; brand-ivory arch 72 wide (the ground cut out)
    arrangement: one tall Witcha-blue slab right of x = 520 with three arches rising from its bottom edge like windows, staggered heights
    pattern: literal motif, the arch, because the README names it the brand's signature shape (radius-arch on the top corners only); one brand-gold hairline echoing the tallest arch
    scales: gaps space-4 (24px), arch widths multiples of space-4, hairline offset space-2 (8px), radius-arch for the tops, radius-none everywhere else
  -->
  <svg viewBox="0 0 960 300" aria-hidden="true">
    <rect class="blue" x="520" y="0" width="440" height="300"></rect>
    <path class="deep" d="M600 300 V156 A60 60 0 0 1 720 156 V300 Z"></path>
    <path class="gold" d="M592 300 V156 A68 68 0 0 1 728 156 V300"></path>
    <path class="aqua" d="M744 300 V192 A48 48 0 0 1 840 192 V300 Z"></path>
    <path class="ivory" d="M864 300 V84 A36 36 0 0 1 936 84 V300 Z"></path>
  </svg>
  <div class="text">
    <p class="name">WITCHA<br>MATCHA</p>
    <p class="tag">Matcha, With Taste.</p>
  </div>
</div>
